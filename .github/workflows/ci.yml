name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  artifact-guard:
    name: Artifact Guard
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail on forbidden added artifact paths
        shell: bash
        run: |
          set -euo pipefail

          BASE_REF="${{ github.base_ref }}"
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          BEFORE_SHA="${{ github.event.before }}"
          HEAD_SHA="${{ github.sha }}"
          EMPTY_SHA="0000000000000000000000000000000000000000"

          diff_from=""
          diff_to="HEAD"

          if [[ -n "$BASE_REF" ]]; then
            git fetch --no-tags origin "$BASE_REF"
            diff_from="$(git merge-base "origin/$BASE_REF" HEAD || true)"
            if [[ -z "$diff_from" ]] && git rev-parse "HEAD^1" >/dev/null 2>&1; then
              diff_from="$(git rev-parse "HEAD^1")"
            fi
          elif [[ -n "$DEFAULT_BRANCH" ]]; then
            git fetch --no-tags origin "$DEFAULT_BRANCH"
            diff_from="$(git merge-base "origin/$DEFAULT_BRANCH" HEAD || true)"
            if [[ -z "$diff_from" ]] && git rev-parse "HEAD^1" >/dev/null 2>&1; then
              diff_from="$(git rev-parse "HEAD^1")"
            fi
          elif [[ "$BEFORE_SHA" != "$EMPTY_SHA" ]] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            diff_from="$BEFORE_SHA"
            diff_to="$HEAD_SHA"
          else
            diff_from="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi

          if [[ -z "$diff_from" ]]; then
            mapfile -t added_paths < <(git diff-tree --no-commit-id --name-status -r "$diff_to" | awk '$1 == "A" { print $2 }')
          else
            mapfile -t added_paths < <(git diff --name-status "$diff_from" "$diff_to" | awk '$1 == "A" { print $2 }')
          fi

          if [[ "${#added_paths[@]}" -eq 0 ]]; then
            exit 0
          fi

          forbidden_regex='^(\.appdata/|\.dotnet/|\.nuget/|\.deps/|\.vendor_py/|tools/.*/bin/|tools/.*/obj/|workbench/apk/|workbench/unity/joined/|workbench/unity/raw/|workbench/extract/|workbench/emulator/|tmp-.*|data/unity-textassets/)'
          forbidden=()

          for path in "${added_paths[@]}"; do
            if [[ "$path" =~ $forbidden_regex ]]; then
              forbidden+=("$path")
            fi
          done

          if [[ "${#forbidden[@]}" -gt 0 ]]; then
            echo "Forbidden artifact paths were added:"
            printf ' - %s\n' "${forbidden[@]}"
            echo
            echo "Do not add extracted game assets, temporary caches, large tool payloads, or ad hoc vendored trees."
            echo "If vendoring is required, consolidate it under vendor/ with provenance notes."
            exit 1
          fi

  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate datasets
        run: npm run verify:data

      - name: Verify vendoring layout
        run: npm run verify:vendoring

      - name: Run tests
        run: npm test

      - name: Run unit tests
        run: npm run test:unit

      - name: Syntax check first-party JS
        run: npm run check:syntax

      - name: Lint docs portability
        run: npm run lint:docs
