name: CodeQL

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "18 4 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript
    steps:
      - name: Skip CodeQL on private repositories without code scanning
        if: ${{ github.event.repository.private }}
        run: echo "Skipping CodeQL because code scanning is unavailable for this private repository."

      - name: Check out repository
        if: ${{ !github.event.repository.private }}
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        if: ${{ !github.event.repository.private }}
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Perform CodeQL analysis
        if: ${{ !github.event.repository.private }}
        uses: github/codeql-action/analyze@v4
